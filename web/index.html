<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=helm2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=helm2" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png?v=helm2" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png?v=helm2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=helm2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Helm" />
    <title>Helm</title>
    <script>
      // Apply persisted theme before React mounts to avoid a flash.
      try {
        var t = localStorage.getItem('dashboard_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#ffffff' : '#14161b');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
