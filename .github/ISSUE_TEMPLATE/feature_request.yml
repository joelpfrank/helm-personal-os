name: Feature request
description: Suggest a focused improvement to Helm Personal OS
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need without sharing real personal data, credentials, private URLs, or confidential workflows.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains only synthetic or fully redacted examples.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user outcome is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful workflow and its human-control boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: data-boundary
    attributes:
      label: Would this require a new external data provider or network transmission?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
