# CodeQL static analysis for the public Helm repository.
#
# Analysis-only: build-mode is explicitly "none" so CodeQL never executes
# npm scripts or any other project code. security-events: write is granted
# only to the single analyze job; everything else stays read-only.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep (Mondays 06:30 UTC) so newly published queries still run
    # against main even when no code is changing.
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Resolve repository visibility
        id: visibility
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          private=$(gh api repos/"$GITHUB_REPOSITORY" --jq '.private')
          echo "private=$private" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          # Private personal repositories cannot upload CodeQL results without
          # GitHub Code Security. Still execute the full analysis in rehearsal;
          # public runs upload automatically once visibility changes. Resolve
          # through the API because scheduled event payloads omit repository.
          upload: "${{ steps.visibility.outputs.private == 'false' && 'always' || 'never' }}"
